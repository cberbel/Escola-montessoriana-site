      '<circle class="fundo" cx="86" cy="86" r="'+R+'"/>'+
      '<circle class="valor" cx="86" cy="86" r="'+R+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'"/></svg>';
    var num=el('strong',null,'0%');
    anel.appendChild(num);
    s.appendChild(anel);
    s.appendChild(el('p','rotulo','de afinidade com a Escola Montessoriana'));
    s.appendChild(el('h1',null,faixa.h));
    s.appendChild(el('p','sub',faixa.s));

    s.appendChild(el('h2',null,'Suas escolhas'));
    var lista=el('ol','recap');
    P.forEach(function(p,k){
      var li=el('li');

      li.appendChild(el('span','r',p[resp[k]]));

        li.appendChild(el('span','selo m','Escola Montessoriana'));
      }else{
        li.appendChild(el('span','selo t','Escola tradicional'));
        var nota=el('span','nota');
        nota.appendChild(el('b',null,'Na Escola Montessoriana'));
        nota.appendChild(document.createTextNode(p.m));
        li.appendChild(nota);
      }
      lista.appendChild(li);
    });
    s.appendChild(lista);

    var fig=el('figure','foto');
    var img=el('img');
    img.src='/images/turmas/agrupada-2.jpg';
    img.alt='Criança ao lado da torre que montou, na sala da Agrupada 2';
    img.loading='lazy';
    fig.appendChild(img);
    fig.appendChild(el('figcaption',null,'Sala da Agrupada 2 (2,5 a 6 anos), na nossa escola em Laranjeiras.'));
    s.appendChild(fig);

    s.appendChild(el('p','fecho','A liberdade de escolher é a estrutura do dia.'));
    s.appendChild(el('p','convite','Vem ver uma manhã de escolhas de perto.'));
    var a=el('a','btn');
    a.href=href;
    a.setAttribute('data-botao','lp-duas-manhas-fim');
    a.innerHTML=ICONE_WA;
    a.appendChild(document.createTextNode('Quero conhecer a escola'));
    s.appendChild(a);

    var refazer=el('button','refazer','Refazer o teste');
    refazer.type='button';
    refazer.addEventListener('click',reiniciar);
    s.appendChild(refazer);

    var rodape=el('footer');
    rodape.appendChild(document.createTextNode('Acolhimento, natureza e imersão em inglês · Montessori dos 9 meses aos 11 anos'));
    rodape.appendChild(el('br'));
    rodape.appendChild(document.createTextNode('Rua das Laranjeiras, 540, fundos — Rio de Janeiro · '));
    var site=el('a',null,'Conhecer o site completo');
    site.href='https://www.escolamontessoriana.com.br/';
    rodape.appendChild(site);
    s.appendChild(rodape);

    // Número e anel sobem juntos; o WhatsApp fixo entra quando o número fecha.
    document.getElementById('waFixo').href=href;
    document.body.classList.add('fim');
    var parado=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){
      anel.querySelector('.valor').setAttribute('stroke-dashoffset',(C*(1-pct/100)).toFixed(1));
      if(parado||pct===0){num.textContent=pct+'%';return;}
      var t0=null,DUR=1000;
      (function quadro(t){
        if(t0===null)t0=t;
        var f=Math.min(1,(t-t0)/DUR);
        num.textContent=Math.round(pct*f)+'%';
        if(f<1)requestAnimationFrame(quadro);
      })(performance.now());
      // Com a aba em segundo plano o requestAnimationFrame não roda e o número
      // ficaria em 0%: o valor final é garantido por tempo.
      setTimeout(function(){num.textContent=pct+'%';},DUR+300);
    },260);
    setTimeout(function(){ctaFixo.classList.add('visivel');},1500);
    // Some quando o botão do fim da página aparece, para não ficarem dois na tela.
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){
        ctaFixo.style.display=es[0].isIntersecting?'none':'';
      }).observe(a);
    }

    // Conta UMA conclusão por navegador: refazer o teste não infla a conversão.
    var jaContou=false;
    try{jaContou=localStorage.getItem('alm_quiz_manhas')==='1';}catch(e){}
    if(!jaContou){
      medir('QuizConcluido','quiz_resultado',{afinidade:pct});
      // A campanha otimiza por este evento PADRÃO ("Concluir inscrição" no Gerenciador):
      // evento personalizado só entra na otimização por conversão personalizada, e a Meta
      // demora a listar evento novo. Nenhuma outra página do site dispara este evento.
      try{fbq('track','CompleteRegistration',{content_name:'teste-duas-manhas'});}catch(e){}
      try{localStorage.setItem('alm_quiz_manhas','1');}catch(e){}
    }
    return s;
  }
  function reiniciar(){
    passo=0;resp=[];
    document.body.classList.remove('fim');
    ctaFixo.classList.remove('visivel');
    ctaFixo.style.display='';
    pintarProgresso();
    trocar(telaPergunta);
  }
  voltar.addEventListener('click',function(){
    if(travado||passo===0||passo>=P.length)return;
    travado=true;
    passo--;
    pintarProgresso();
    trocar(telaPergunta);
  });
  pintarProgresso();
  trocar(telaPergunta);
})();
</script>

<!-- Medição de origem/gclid: versão estática do utils/gclid.ts do site principal.
     MESMAS chaves de localStorage (alm_*) — quem navega entre a LP e o site
     mantém o mesmo código de protocolo. Qualquer mudança lá deve refletir aqui. -->
<script>
(function(){
  var K_G='alm_gclid',K_R='alm_ref',K_REG='alm_ref_registrado',K_O='alm_origem',K_C='alm_campanha';
  var VAL=90*24*60*60*1000;
  var SB='https://rmpnqrvsmxhnrwlgqmdp.supabase.co';
  var SBK='sb_publishable_bg4n-MXnoYVWomRN90WTOg_HOdq3_9G';
  function ler(k){try{var b=localStorage.getItem(k);return b?JSON.parse(b):null}catch(e){return null}}
  function gravar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var params=new URLSearchParams(location.search);
  var gclidUrl=params.get('gclid');
  if(gclidUrl){
    // kw/mt/net/agid vem do modelo de acompanhamento e pertencem ao mesmo clique.
    // NAO apagar K_REG aqui (correcao 15edfd1 do site): a assinatura origem+gclid
    // ja detecta a mudanca e o 409 forca ref novo.
    var regG={gclid:gclidUrl,ts:Date.now()};
    ['kw','mt','net','agid'].forEach(function(c){var v=params.get(c);if(v)regG[c]=v;});
    gravar(K_G,regG);
  }
  // fbclid/utm_*: e o que separa story, reels, bio e pago no Instagram — o referrer
  // do app vem vazio e nao distingue peca (ver docs/utm-instagram.md, 25/08/2026).
  // Vale o toque MAIS RECENTE; sem parametro na URL nao apaga o que ja estava guardado.
  // Os cortes espelham os limites da RLS: campo grande demais faz o insert inteiro
  // ser recusado e a medicao some em silencio.
  var fbclidUrl=(params.get('fbclid')||'').trim();
  (function(){
    var reg={ts:Date.now()};
    if(fbclidUrl&&!/\s/.test(fbclidUrl))reg.fbclid=fbclidUrl.slice(0,255);
    // O link da bio usa utm_source=ig; normalizar evita dois nomes para a mesma coisa
    // (detectar() ja trata ig e instagram como a mesma origem).
    var APELIDOS={ig:'instagram',fb:'facebook'};
    [['utm_source',60],['utm_medium',60],['utm_campaign',120],['utm_content',120]].forEach(function(p){
      var v=(params.get(p[0])||'').trim();
      if(!v)return;
      v=v.slice(0,p[1]).toLowerCase();
      if(p[0]==='utm_source'&&APELIDOS[v])v=APELIDOS[v];
      reg[p[0]]=v;
    });
    if(reg.fbclid||reg.utm_source||reg.utm_medium||reg.utm_campaign||reg.utm_content)gravar(K_C,reg);
  })();
  function obterC(){var r=ler(K_C);if(!r)return null;if(Date.now()-r.ts>VAL)return null;return r}
  function detectar(){
    if(gclidUrl)return 'google_ads';
    var utm=(params.get('utm_source')||'').toLowerCase();
    if(utm){
      if(utm.indexOf('instagram')>=0||utm==='ig')return 'instagram';
      if(utm.indexOf('facebook')>=0||utm==='fb')return 'facebook';
      if(utm.indexOf('bing')>=0)return 'bing';
      if(utm.indexOf('google')>=0)return 'google_organico';
    }
    var ref=document.referrer;
    if(!ref)return 'direto';
    try{
      var u=new URL(ref);
      if(u.hostname===location.hostname){return u.pathname.indexOf('/informativo')===0?'informativo':null}
      var h=u.hostname;
      if(/(^|\.)google\./.test(h))return 'google_organico';
      if(/(^|\.)instagram\.com$/.test(h))return 'instagram';
      if(/(^|\.)(facebook\.com|fb\.me)$/.test(h))return 'facebook';
      if(/(^|\.)bing\.com$/.test(h))return 'bing';
      return 'outro_site';
    }catch(e){return 'direto'}
  }
  var det=detectar();
  if(det){
    var at=ler(K_O);
    var valida=at&&(Date.now()-at.ts<=VAL);
    // Clique pago sempre promove. O fbclid so promove quando a peca se identifica
    // como Meta: anuncio sem utm e sem referrer seria detectado como 'direto' e
    // apagaria uma origem boa que ja estava guardada.
    var pagoAgora=!!gclidUrl||(!!fbclidUrl&&(det==='instagram'||det==='facebook'));
    if(!valida||pagoAgora){var efetiva=(det!=='google_ads'&&obterG())?'google_ads':det;gravar(K_O,{origem:efetiva,ts:Date.now()});}
  }
  function obterG(){var r=ler(K_G);if(!r||!r.gclid)return null;if(Date.now()-r.ts>VAL)return null;return r.gclid}
  function obterO(){var r=ler(K_O);if(!r||!r.origem)return null;if(Date.now()-r.ts>VAL)return null;return r.origem}
  function novoRef(){var n=Math.random().toString(36).slice(2,8).toUpperCase();gravar(K_R,n);return n}
  function obterRef(){var e=ler(K_R);return e||novoRef()}
  (function registrar(){
    var g=obterG(),o=obterO();
    if(!g&&!o)return;
    // A peca entra na assinatura: sem isso, quem ja visitou pela bio e volta por um
    // story reusaria o registro antigo (origem e gclid nao mudaram) e o story sumiria.
    var c=obterC()||{};
    var ass=(o||'sem')+'|'+(g||'sem')+'|'+(c.fbclid||'sem')+'|'+(c.utm_content||'sem');
    var ja=ler(K_REG);
    if(ja===ass)return;
    var ref=obterRef();
    if(!ref)return;
    var body={ref:ref};
    if(o)body.origem=o;
    if(g){
      body.gclid=g;
      var rg=ler(K_G)||{};
      ['kw','mt','net','agid'].forEach(function(x){if(rg[x])body[x]=rg[x];});
    }
    ['fbclid','utm_source','utm_medium','utm_campaign','utm_content'].forEach(function(k){if(c[k])body[k]=c[k];});
    var enviar=function(codigo){
      body.ref=codigo;
      return fetch(SB+'/rest/v1/cliques_anuncio',{
        method:'POST',
        headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify(body)
      });
    };
    // 409 = ref ja usado por assinatura antiga: gera codigo novo e tenta UMA vez
    // (mesma semantica da correcao 15edfd1 do site). So r.ok marca como registrado.
    enviar(ref).then(function(r){
      if(r.status===409){var n=novoRef();if(n)return enviar(n);}
      return r;
    }).then(function(r){if(r&&r.ok)gravar(K_REG,ass)}).catch(function(){});
  })();
  document.addEventListener('click',function(e){
    var alvo=e.target;
    var link=alvo&&alvo.closest?alvo.closest('a[href*="wa.me"]'):null;
    if(!link)return;
    var codigo=obterRef();
    if(codigo){
      try{
        var url=new URL(link.href);
        var texto=url.searchParams.get('text')||'';
        if(!/Protocolo:/i.test(texto)){
          url.searchParams.set('text',texto+'\n\nProtocolo: '+codigo);
          link.href=url.toString();
        }
      }catch(err){}
    }
    if(typeof window.trackWhatsAppConversion==='function')window.trackWhatsAppConversion();
    window.dataLayer=window.dataLayer||[];
    window.dataLayer.push({event:'whatsapp_click',page_path:location.pathname,button_id:link.getAttribute('data-botao')||'lp'});
  },true);
})();
</script>
