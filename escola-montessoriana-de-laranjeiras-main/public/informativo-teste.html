<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola Montessoriana</title>
<script>
/* Sorteador do teste de landing (23/08): distribui 1/3 entre o informativo longo,
   o curto e o curto com precos — e FIXA a versao por visitante (localStorage),
   para a mesma pessoa sempre ver a mesma pagina. UTMs/gclid seguem intactos. */
(function(){
  var VERSOES = ['informativo.html', 'informativo2.html', 'informativo3.html'];
  var alvo;
  try {
    alvo = localStorage.getItem('alm_lp_teste');
    if (VERSOES.indexOf(alvo) === -1) {
      alvo = VERSOES[Math.floor(Math.random() * VERSOES.length)];
      localStorage.setItem('alm_lp_teste', alvo);
    }
  } catch (e) { alvo = VERSOES[0]; }
  location.replace('/' + alvo + location.search + location.hash);
})();
</script>
</head>
<body></body>
</html>
